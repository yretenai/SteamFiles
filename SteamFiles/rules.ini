
[AntiCheat]
EOSEasyAntiCheat = EasyAntiCheat/Settings.json

[Debug]
PDB = \.pdb$ ; Windows Debug Symbols
SYM = \.sym$ ; Linux Debug Symbols
MAP = \.map$ ; Linker Mapping
LIB = \.lib$ ; Linker Library
DSYM = \.dSYM$ ; Mac Debug Symbols
Debug = \.de?bu?g$ ; Debug Symbols
UnityIL2CPP = BackUpThisFolder_ButDontShipItWithYourGame ; Unity Il2Cpp debug debris

[Debris]
Log = \.log$ ; Log Files
DMP = \.dmp$ ; MiniDump Files
Obj = \.o$ ; Object Files
Response = \.(response|rsp)$ ; Linker Response Files
UnityBurst = BurstDebugInformation_DoNotShip ; Unity Burst debug debris
COPYING = (/|\\)COPYING($|\.) ; FOSS Copying info

[Source]
Cxx = \.c[px]+$ ; C++ Files
CxxHeaders = \.h[px]+$ ; C++ Header Files
C = \.c$ ; C Files
CHeaders = \.h$ ; Header Files
CSharp = \.cs$ ; CS Files
Rust = \.rs$ ; CS Files
Javascript = \.js$ ; CS Files
Python = \.py$ ; Python Files
Lua = \.lua$ ; Lua Files

[Archive]
Zip = \.zip$ ; Zip Files
7z = \.7z$ ; Zip Files
Tar = \.tar[\.$] ; Zip Files
Rar = \.rar$ ; Zip Files

[SDK]
ResonanceAudio = .*?resonanceaudio\.(?:dll|so|bundle|dylib)$
UnityAddressables[] = StreamingAssets/aa/settings.json$ ; Unity Addressable Assets settings file
UnityAddressables[] = StreamingAssets/aa/catalog.json$ ; Unity Addressable Assets default catalog
UnityVulpex = \.vulpex$ ; Vulpex 3D WebView
UnityFBX = UnityFbxSdkNative\.(dll|so|dylib)$
Google_Firebase = FirebaseCpp.*?\.(dll|so|bundle|dylib)$ ; Firebase C++ Libraries
Sqlite3 = (lib)?sqlite3\.(dll|so|dylib)$ ; Sqlite3 
Microsoft_D3D12 = D3D12Core\.dll ; D3D12 Core DLL
Overwolf = (lib)?owgameevents(64)?\.dll$ ; Overwolf Event API
GOG_Galaxy[] = (lib)?Galaxy(64)?\.(dll|so|dylib)$ ; GOG Galaxy API
GOG_Galaxy[] = GalaxyCSharpGlue\.dll$ ; GOG Galaxy C# API
Humble = (lib)?humble_api(64)?\.(dll|so|dylib)$ ; Humble Store API
JVM = \.jar$ ; JVM Jar file
AWS_Gamelift = aws-cpp-sdk-gamelift\.(dll|so|dylib)$ ; AWS Gamelift SDK
LWJGL = lwjgl\.jar$ ; Lightweight Java GL
Photon = ((\\|/)PhotonControl.exe|(\\|/)Photon\w+.dll)$ ; Photon Networking

[Engine]
LuminousEngine = \.earc$ ; Luminous Engine earc
CrystalTools = filelist.\.win32\.bin$ ; Crystal Tools filelist
Radec[] = \.sqpack$ ; Radec sqpack? FFXIV.
Radec[] = \.pac$ ; Radec sqpack? FFXIV.
NeoX = \.npk$ ; NetEase NeoX
KTGL2 = \.rdb$ ; Koei Tecmo KTGL2 ResourceDB File
KTGLElixir = PACK01\.PAK$ ; Gust KTGL PAK file
GameMaker[] = .+.yy$ ; GameMaker bytecode
XLegendPKG[] = pkg.pkg$ ; Root package for X-Legend games
XLegendNFS[] = /nfs/[0-f] ; NFS directories for X-Legend games
XLegendNFS[] = packageindex$ ; NFS package index for X-Legend games

[Versions.Unreal]
UAsset = \.(u|g|w)(asset|map)$ ; Loose Unreal uasset Files
UPackage = Cooked.*?/.+.(u|g|w)pk$ ; Unreal Engine 3 files
UPak = Content/Paks/.*\.pak$ ; Unreal Engine 4 files
UIoStore[] = Content/Paks/.*\.ucas$ ; Unreal Engine 5 files
UIoStore[] = Content/Paks/.*\.utoc$ ; Unreal Engine 5 files
